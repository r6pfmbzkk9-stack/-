<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Data funnel" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a18"/><stop offset="1" stop-color="#14204a"/></linearGradient>
<linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".07"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<rect width="1000" height="470" rx="20" fill="url(#bg)"/>
<rect width="1000" height="470" rx="20" fill="url(#dots)"/>
<text x="40" y="44" font-family="'Segoe UI','Noto Sans Arabic',Tahoma,Arial,sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="start" >Data Funnel</text>
<text x="960" y="44" font-family="'Segoe UI','Noto Sans Arabic',Tahoma,Arial,sans-serif" font-size="22" fill="#22d3ee" font-weight="bold" text-anchor="end" >قمع البيانات</text>
<defs><linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
<polygon points="80,68 920,68 860,150 140,150" fill="url(#fg)" fill-opacity=".85"/>
